name: CI

# push 전에 깨진 코드를 잡기 위한 파이프라인.
# Vercel 빌드는 배포 시점에만 돌므로, PR/브랜치 단계의 1차 방어선을 여기서 만든다.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # 빌드 타임에 실제 백엔드를 부르지 않는다(모든 env 접근이 lazy).
  # 형식만 유효한 더미 값으로 "env 누락 throw" 만 회피한다.
  # 운영 시크릿은 CI 에 넣지 않는다 — 실제 값 검증은 Vercel 빌드가 담당.
  NEXT_PUBLIC_SUPABASE_URL: https://ci-dummy.supabase.co
  NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-dummy-anon-key
  SUPABASE_SERVICE_ROLE_KEY: ci-dummy-service-role-key
  NEXT_PUBLIC_APP_URL: http://localhost:3000
  NEXT_TELEMETRY_DISABLED: "1"

jobs:
  verify:
    name: typecheck · lint · test · pdf · build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json 의 packageManager 를 따른다
      # (여기에 version 을 또 지정하면 "Multiple versions of pnpm specified" 로 실패).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # 의존성 취약점 가시화 (SEC-12) — **비차단**.
      # next 14(지원 종료)의 high/critical advisory 가 남아 있어 게이트로 두면 CI 가 즉시 red 가 된다.
      # continue-on-error 라 이 단계가 실패해도 잡 결론은 바뀌지 않고, 결과는 잡 요약에 남는다.
      # registry 응답이 멈춰도 verify 잡 전체 timeout(20분)을 태우지 않게 audit 을 셸 timeout(150s)으로
      # 끊는다 — exit 124 는 일반 단계 실패라 continue-on-error 가 확실히 흡수한다. 단계 timeout-minutes 는
      # 요약 기록까지 멈추는 경우의 백스톱이다(단계 timeout 이 continue-on-error 로 흡수되는지는
      # 공식 문서에 명시가 없어 1차 제한으로 쓰지 않는다).
      # Next 16 전환으로 high 이상을 해소한 뒤 차단 게이트로 올린다.
      - name: Dependency audit (non-blocking)
        continue-on-error: true
        timeout-minutes: 5
        run: |
          set +e
          timeout --kill-after=10s 150s pnpm audit --prod --audit-level=high > "$RUNNER_TEMP/audit.txt" 2>&1
          status=$?
          {
            echo "## pnpm audit --prod --audit-level=high"
            echo
            if [ "$status" -eq 0 ]; then
              echo "high 이상 취약점 없음."
            elif [ "$status" -eq 124 ] || [ "$status" -eq 137 ]; then
              echo "audit 이 150s 안에 끝나지 않아 중단했다 (비차단)."
            else
              echo "exit code ${status} — high 이상 취약점이 있거나 audit 조회에 실패했다 (비차단)."
            fi
            echo
            echo '```'
            tail -n 5 "$RUNNER_TEMP/audit.txt"
            echo '```'
            echo
            echo "<details><summary>전체 출력 (앞 400줄)</summary>"
            echo
            echo '```'
            head -n 400 "$RUNNER_TEMP/audit.txt"
            echo '```'
            echo
            echo "</details>"
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      # 페이지 수 + 첫 페이지 해시 회귀 (CLAUDE.md §테스트).
      # linux-x64 픽셀 baseline 이 아직 없으면 이번 실행에서 기록만 하고 통과한다
      # (구조 검증은 항상 엄격). 로그의 해시를 baseline 에 커밋하면 다음부터 비교된다.
      - name: PDF regression
        run: pnpm test:pdf

      - name: Upload PDF baseline / diff
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pdf-regression
          path: |
            test/fixtures/pdf-baseline.json
            tmp/pdf-regression/
          if-no-files-found: ignore
          retention-days: 7

      - name: Build
        run: pnpm build

  e2e:
    name: e2e smoke (desktop + mobile)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json 의 packageManager 를 따른다
      # (여기에 version 을 또 지정하면 "Multiple versions of pnpm specified" 로 실패).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      # webServer 설정이 pnpm dev 를 자동으로 띄운다 (playwright.config.ts).
      - name: Run E2E
        run: pnpm e2e

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 7

  a11y:
    name: accessibility (axe-core WCAG 2.1 AA)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json 의 packageManager 를 따른다
      # (여기에 version 을 또 지정하면 "Multiple versions of pnpm specified" 로 실패).
      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps chromium

      - name: Run a11y audit
        run: pnpm test:a11y

      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: a11y-report
          path: playwright-report/
          retention-days: 7
