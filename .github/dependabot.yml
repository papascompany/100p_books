# Dependabot 버전 업데이트 (SEC-12).
#
# - 저장소 Settings → Code security 의 "Dependabot alerts / security updates" 는 이 파일과 별개다.
#   취약점 알림·보안 PR 은 그 설정을 켜야 동작한다(운영 콘솔 작업).
# - minor/patch 는 한 PR 로 묶어 리뷰 부담을 줄인다. CI(typecheck·lint·test·pdf·build·e2e·a11y)가
#   각 PR 에서 그대로 돈다.
# - 프레임워크 메이저는 별도 마이그레이션 마일스톤으로 다룬다(아래 ignore). 서로 묶여 있어
#   하나만 올리면 빌드가 깨진다: next ↔ react/react-dom ↔ @types/react* ↔ eslint-config-next ↔ eslint.
#   fabric 메이저는 직렬화 포맷·에디터 전반 회귀가 크다. @types/node 메이저는 engines "24.x" 와 맞춘다.
#   tailwindcss 4 는 설정·PostCSS 플러그인 구조가 바뀌어 단독으로 올리면 빌드가 깨지고, tailwind-merge 3 은
#   Tailwind 4 전용이라 Tailwind 3 위에서는 CI 가 통과해도 클래스 병합이 조용히 틀어진다 → 둘은 Tailwind 4 전환과 함께(2026-10-27).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: "09:00"
      timezone: Asia/Seoul
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - minor
          - patch
    ignore:
      - dependency-name: next
        update-types: ["version-update:semver-major"]
      - dependency-name: react
        update-types: ["version-update:semver-major"]
      - dependency-name: react-dom
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/react*"
        update-types: ["version-update:semver-major"]
      - dependency-name: fabric
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint
        update-types: ["version-update:semver-major"]
      - dependency-name: eslint-config-next
        update-types: ["version-update:semver-major"]
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwindcss
        update-types: ["version-update:semver-major"]
      - dependency-name: tailwind-merge
        update-types: ["version-update:semver-major"]
      # 인쇄 렌더 엔진 — 1.1.0 에서 텍스트 획이 얇아졌다(PDF 회귀 text 페이지 잉크 −9%, 2026-11-10 실측,
      # STATUS §0-34). 인쇄물 글자 굵기가 바뀌므로 오너가 실물 교정 후 승인할 때까지 1.0.x 에 고정한다.
      # package.json 도 정확 버전("1.0.13")으로 고정. 재평가: 실물 테스트 인쇄 → test:pdf:update.
      - dependency-name: "@napi-rs/canvas"
        versions: [">=1.1.0"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    labels:
      - dependencies
    commit-message:
      prefix: chore
      include: scope
